name: "🐛 Bug report / Bug 反馈"
description: "Report a problem to help improve Islet / 报告一个问题，帮助 Islet 变得更好"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in the details below. / 感谢反馈！请尽量填写以下信息。

  - type: textarea
    id: description
    attributes:
      label: "Description / 问题描述"
      description: "A clear description of the bug. / 清晰描述遇到的问题。"
      placeholder: "e.g. When opening the settings panel... / 例如：打开设置面板时……"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce / 复现步骤"
      description: "How to reproduce, step by step. / 如何一步步触发这个问题。"
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior / 期望行为"
      description: "What you expected to happen. / 你认为正确的表现应该是怎样。"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots / 截图"
      description: "Paste screenshots or recordings if any. / 如有相关截图或录屏，请粘贴。"
    validations:
      required: false

  - type: dropdown
    id: browser
    attributes:
      label: "Browser / 浏览器"
      options:
        - Chrome
        - Edge
        - Firefox
        - "Other / 其他"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "Extension version / 扩展版本"
      description: "See the extensions page or the About tab. / 见扩展管理页或设置面板「关于」。"
      placeholder: "e.g. / 例如 1.0.0"
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: "OS / 操作系统"
      placeholder: "e.g. / 例如 Windows 11 / macOS 14 / Ubuntu 24.04"
    validations:
      required: false
