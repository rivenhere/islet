name: "✨ Feature request / 功能建议"
description: "Suggest a new feature or improvement / 提出一个新功能或改进想法"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Note that Islet is committed to **zero network permissions / privacy first**; features requiring cross-origin requests may not be accepted.
        感谢建议！请注意 Islet 坚持**零联网权限 / 隐私至上**，需要跨域接口的功能可能无法采纳。

  - type: textarea
    id: problem
    attributes:
      label: "The problem / 想解决的问题"
      description: "What problem would this feature solve? / 这个建议想解决什么痛点？"
      placeholder: "e.g. I wish I could ... below the search bar / 例如：我希望能在搜索栏下方……"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Proposed solution / 方案设想"
      description: "How you'd like it to work. / 你期望它如何工作。"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives / 备选方案"
      description: "Other approaches you've considered. / 考虑过的其他做法。"
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: "Privacy principle / 隐私原则"
      options:
        - label: "This feature needs no network or extra permissions (or I explained above why it's necessary). / 该功能无需任何联网权限或额外权限（或我已在上文说明为何必要）。"
          required: false

  - type: textarea
    id: extra
    attributes:
      label: "Additional context / 补充信息"
      description: "Mockups, examples, references, etc. / 参考图、示例、相关链接等。"
    validations:
      required: false
