name: Validate Data

# Validates sites.json on PRs and pushes that change the official site data or its validation script.
# For PRs, comment-validation.yml then posts the result, because this run's token is read-only on fork PRs.
on:
  pull_request:
    paths:
      - "src/data/**"
      - "scripts/validate-sites.mjs"
  push:
    branches: [main]
    paths:
      - "src/data/**"
      - "scripts/validate-sites.mjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate sites.json
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p pr-result
          echo "$PR_NUMBER" > pr-result/pr-number
          set +e
          node scripts/validate-sites.mjs 2>&1 | tee pr-result/output.txt
          exit "${PIPESTATUS[0]}"
      - name: Save the result for the comment workflow
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-result
          path: pr-result/
          retention-days: 1
