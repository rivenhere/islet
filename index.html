<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Islet</title>
    <!-- Apply the theme synchronously before first paint, to avoid a light-to-dark flash on refresh (FOUC).
         It must be an external script, not inline: the MV3 extension CSP (script-src 'self') blocks inline scripts,
         so packaged as an extension, flash prevention would stop working. A synchronous <script src> in <head> blocks rendering
         and runs before first paint, with the same effect as inline. -->
    <script src="./theme-init.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
